<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Fredoka:wght@600;700&family=Great+Vibes&family=M+PLUS+Rounded+1c:wght@700;800&family=Montserrat:wght@800;900&family=Orbitron:wght@700;900&family=Pacifico&family=Rajdhani:wght@600;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="container">
  <h1>Weekly Maker</h1>

  <div class="preview-area">
    <canvas id="scheduleCanvas" width="960" height="540"></canvas>
  </div>

  <div class="controls">

    <!-- テンプレート選択 -->
    <div class="control-group">
      <label for="templateSelect">テンプレート:</label>
      <select id="templateSelect">
        <!-- manifest.json から動的に生成 -->
      </select>
    </div>

    <div class="control-group">
      <label for="startDate">開始日:</label>
      <input type="date" id="startDate">
    </div>

    <!-- カスタムフォント読み込み機能 -->
    <div class="control-group">
      <label for="fontFileUpload">カスタムフォント:</label>
      <input type="file" id="fontFileUpload" accept=".ttf,.otf,.woff,.woff2">
      <span class="hint-text">※.ttf / .otf / .woff 形式対応</span>
    </div>

    <div class="control-group">
      <label for="titleFontSelect">タイトルフォント:</label>
      <select id="titleFontSelect">
        <option value="'Pacifico', cursive">筆記体① (Pacifico)</option>
        <option value="'Dancing Script', cursive">筆記体② (Dancing Script)</option>
        <option value="'Great Vibes', cursive">筆記体③ (Great Vibes)</option>
        <option value="'Fredoka', sans-serif">ポップ (Fredoka)</option>
        <option value="'Montserrat', sans-serif">モダン太字 (Montserrat)</option>
        <option value="'M PLUS Rounded 1c', sans-serif">丸ゴシック (M PLUS Rounded)</option>
        <option value="'Orbitron', sans-serif">サイバー・近未来 (Orbitron)</option>
        <option value="'Rajdhani', sans-serif">メカニカル (Rajdhani)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="bodyFontSelect">本文フォント:</label>
      <select id="bodyFontSelect">
        <option value="'M PLUS Rounded 1c', sans-serif">丸ゴシック (M PLUS Rounded)</option>
        <option value="'Zen Maru Gothic', sans-serif">ぽっちゃり丸ゴシック (Zen Maru)</option>
        <option value="'Montserrat', 'ヒラギノ角ゴ ProN', sans-serif">ゴシック体 / モダン</option>
        <option value="'Yu Mincho', '游明朝', serif">明朝体 (Yu Mincho)</option>
        <option value="'Zen Kaku Gothic New', sans-serif">角ゴシック・太字 (Zen Kaku)</option>
        <option value="'Orbitron', sans-serif">サイバー・近未来 (Orbitron)</option>
        <option value="'Rajdhani', sans-serif">メカニカル (Rajdhani)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="themeColorPicker">メインテーマ:</label>
      <div class="color-picker" id="colorPicker">
        <button class="color-btn active" style="background:#85c7f2;" data-color="#85c7f2"></button>
        <button class="color-btn" style="background:#ff85a1;" data-color="#ff85a1"></button>
        <button class="color-btn" style="background:#ffb703;" data-color="#ffb703"></button>
        <button class="color-btn" style="background:#2ec4b6;" data-color="#2ec4b6"></button>
        <button class="color-btn" style="background:#708dff;" data-color="#708dff"></button>
        <button class="color-btn" style="background:#b5838d;" data-color="#b5838d"></button>
        <button class="color-btn" style="background:#4a4e69;" data-color="#4a4e69"></button>
        <input type="color" id="themeColorPicker" value="#85c7f2" title="自由なカラーを選択">
      </div>
    </div>

    <div class="sub-section">
      <div class="control-group">
        <label for="imageUpload">キャラクター画像:</label>
        <input type="file" id="imageUpload" accept="image/*">
        <span class="hint-text">※エリア内ドラッグで移動、ホイールで拡縮</span>
      </div>

      <div class="control-group" id="imageControls" style="display: none;">
        <label for="zoomRange">画像サイズ調整:</label>
        <input type="range" id="zoomRange" min="0.2" max="3.0" step="0.05" value="1.0">
        <button type="button" class="btn-action" id="resetImgBtn">位置・サイズリセット</button>
      </div>

      <div class="control-group">
        <label for="bgTypeSelect">エリア背景設定:</label>
        <select id="bgTypeSelect">
          <option value="color">単色カラー指定</option>
          <option value="image">背景画像（柄など）をアップ</option>
        </select>
        <div id="bgColorContainer">
          <input type="color" id="areaBgColor" value="#ffffff" title="右側エリアの背景色">
        </div>
        <div id="bgImageContainer" style="display: none;">
          <input type="file" id="bgImageUpload" accept="image/*">
          <button type="button" class="btn-action" id="clearBgImgBtn" style="display:none;">背景画像を削除</button>
        </div>
      </div>

      <div class="control-group">
        <label for="illustCaption">ひとこと/クレジット:</label>
        <input type="text" id="illustCaption" class="text-input" placeholder="例: Illust: 〇〇 / 枠:@xxx">
      </div>
    </div>

    <div class="schedule-inputs" id="scheduleInputs"></div>

    <button class="btn-download" id="downloadBtn">名前を付けて画像を保存する</button>

  </div>
</div>

<script type="module" src="./js/main.js"></script>

</body>
</html>
